<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santé métabolique & régime cétogène — Gevlon Académie</title>
<meta name="description" content="Formation gratuite Gevlon : santé métabolique et régime cétogène, protocole AfroKeto™.">
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#00308F; --navy-deep:#001F5C; --navy-soft:#EAF0FB;
    --orange:#F9921C; --orange-text:#B5650E;
    --ink:#131C33; --ink-soft:#54617A; --white:#FFFFFF; --paper:#F6F8FC;
    --green:#1a7a3d; --green-soft:#DCF5E3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;color:var(--navy-deep);}
  a{color:inherit;}
  .mono{font-family:'Space Grotesk',monospace;}

  header{
    position:sticky;top:0;z-index:40;background:rgba(246,248,252,0.95);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(0,48,143,0.1);
  }
  .head-wrap{max-width:1240px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;}
  .head-left{display:flex;align-items:center;gap:18px;}
  .head-left img{height:28px;}
  .back-link{font-size:0.85rem;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .back-link:hover{color:var(--navy);}
  .head-progress{display:flex;align-items:center;gap:10px;font-size:0.8rem;color:var(--ink-soft);}
  .head-bar{width:140px;height:7px;background:var(--navy-soft);border-radius:999px;overflow:hidden;}
  .head-bar-fill{height:100%;background:var(--orange);width:0%;transition:width .4s ease;}

  .layout{max-width:1240px;margin:0 auto;padding:32px 24px 80px;display:grid;grid-template-columns:290px 1fr;gap:32px;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} .sidebar{order:2;} }

  .sidebar{
    background:var(--white);border-radius:16px;padding:18px;border:1px solid rgba(0,48,143,0.08);
    height:fit-content;position:sticky;top:88px;
  }
  .sidebar h4{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);padding:6px 10px 12px;}
  .mod-item{
    display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;cursor:pointer;
    font-size:0.88rem;font-weight:600;color:var(--ink);transition:background .15s ease;
  }
  .mod-item:hover{background:var(--navy-soft);}
  .mod-item.active{background:var(--navy);color:#fff;}
  .mod-check{
    width:24px;height:24px;border-radius:50%;flex-shrink:0;background:var(--navy-soft);color:var(--navy);
    display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;font-family:'Space Grotesk',monospace;
  }
  .mod-item.active .mod-check{background:rgba(255,255,255,0.2);color:#fff;}
  .mod-item.done .mod-check{background:var(--green);color:#fff;}
  .mod-title{flex:1;}
  .mod-sub{display:block;font-size:0.72rem;font-weight:500;color:var(--ink-soft);margin-top:2px;}
  .mod-item.active .mod-sub{color:rgba(255,255,255,0.75);}

  .main-panel{background:var(--white);border-radius:18px;padding:40px;border:1px solid rgba(0,48,143,0.08);}
  .main-panel h2{font-size:1.5rem;margin-bottom:6px;}
  .lesson-tag{font-size:0.78rem;font-weight:700;color:var(--orange-text);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;display:block;}

  .video-box{
    aspect-ratio:16/9;background:linear-gradient(135deg,var(--navy),var(--navy-deep));border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;margin:20px 0 28px;gap:10px;
  }
  .video-box .illo{width:70%;max-width:280px;}
  .video-box .illo svg{width:100%;height:auto;display:block;}
  .video-box .note{font-size:0.78rem;color:rgba(255,255,255,0.65);max-width:320px;text-align:center;padding:0 20px;}

  .lesson-text p{color:var(--ink);font-size:0.98rem;margin-bottom:16px;}
  .takeaways{background:var(--navy-soft);border-radius:12px;padding:22px 24px;margin:26px 0;}
  .takeaways h4{font-size:0.85rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--navy);margin-bottom:12px;}
  .takeaways ul{padding-left:20px;}
  .takeaways li{font-size:0.92rem;margin-bottom:8px;color:var(--ink);}

  .disclaimer{font-size:0.78rem;color:var(--ink-soft);background:#FDF3E4;border:1px solid #F3D9A8;border-radius:10px;padding:12px 16px;margin:20px 0;}

  .quiz{border-top:1px solid var(--navy-soft);padding-top:26px;margin-top:30px;}
  .quiz h4{font-size:0.85rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin-bottom:16px;}
  .q-block{margin-bottom:22px;}
  .q-text{font-weight:700;font-size:0.94rem;margin-bottom:10px;color:var(--navy-deep);}
  .q-opt{
    display:block;border:1.5px solid var(--navy-soft);border-radius:9px;padding:10px 14px;margin-bottom:8px;
    font-size:0.88rem;cursor:pointer;transition:border-color .15s ease;
  }
  .q-opt:hover{border-color:var(--navy);}
  .q-opt input{margin-right:10px;}
  .q-opt.correct{border-color:var(--green);background:var(--green-soft);}
  .q-opt.wrong{border-color:#E24B4A;background:#FCEBEB;}

  .btn-primary{
    background:var(--orange);color:var(--navy-deep);padding:13px 26px;border-radius:999px;border:none;
    font-weight:700;font-size:0.9rem;cursor:pointer;transition:transform .15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .btn-secondary{
    background:transparent;color:var(--navy);padding:12px 24px;border-radius:999px;border:1.5px solid var(--navy);
    font-weight:700;font-size:0.88rem;cursor:pointer;
  }
  .quiz-result{font-size:0.88rem;font-weight:700;margin:14px 0;padding:10px 14px;border-radius:9px;}
  .quiz-result.pass{background:var(--green-soft);color:var(--green);}
  .quiz-result.fail{background:#FCEBEB;color:#A32D2D;}

  .cert-wrap{text-align:center;padding:20px 0;}
  .cert-card{
    border:3px solid var(--navy);border-radius:16px;padding:44px 40px 26px;margin:20px auto;max-width:640px;
    background:linear-gradient(160deg,#fff,var(--navy-soft));position:relative;
  }
  .cert-card .logo-img{height:44px;margin:0 auto 20px;display:block;}
  .cert-card .brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;color:var(--navy);margin-bottom:26px;}
  .cert-card .h{font-size:0.8rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink-soft);margin-bottom:14px;}
  .cert-card .name{font-family:'Fraunces',serif;font-size:2rem;color:var(--navy-deep);margin-bottom:14px;}
  .cert-card .course{font-size:1.05rem;color:var(--ink);margin-bottom:22px;}
  .cert-card .meta{font-size:0.8rem;color:var(--ink-soft);margin-bottom:22px;}
  .cert-footer{
    border-top:1px solid rgba(0,48,143,0.18);padding-top:16px;margin-top:6px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:0.72rem;color:var(--ink-soft);text-align:left;
  }
  .cert-footer b{color:var(--navy-deep);}
  .cert-footer .col{flex:1;min-width:180px;}
  .cert-footer .col.right{text-align:right;}
  #certQR svg{width:64px;height:64px;}
  @media (max-width:520px){ .cert-footer .col.right{text-align:left;} }
  .cert-name-input{margin:0 auto 20px;display:block;max-width:320px;width:100%;padding:12px 16px;border-radius:9px;border:1.5px solid var(--navy-soft);font-size:0.95rem;text-align:center;font-family:'Inter',sans-serif;}

  @media print{
    header, .sidebar, .quiz, .video-box, .lesson-text, .takeaways, .disclaimer, .cert-actions,
    .cert-wrap > .lesson-tag, .cert-wrap > h2, .cert-wrap > p, .cert-name-input{display:none !important;}
    body{background:#fff;}
    .layout{display:block;padding:0;}
    .main-panel{border:none;padding:0;box-shadow:none;}
    .cert-card{margin:0 auto;box-shadow:none;}
  }
</style>
</head>
<body>

<header>
  <div class="head-wrap">
    <div class="head-left">
      <a href="index.html" class="back-link">← Accueil</a>
      <img id="logoNav" alt="Gevlon">
    </div>
    <div id="headAccount" style="font-size:0.82rem;font-weight:600;color:var(--navy);"></div>
    <div class="head-progress">
      <span id="progressLabel">0 / 8 modules</span>
      <div class="head-bar"><div class="head-bar-fill" id="headBarFill"></div></div>
    </div>
  </div>
</header>

<!-- Bandeau de connexion si on arrive sans lien personnel -->
<div id="loginBanner" style="display:none;background:#FDF3E4;border-bottom:1px solid #F3D9A8;padding:10px 24px;text-align:center;font-size:0.85rem;color:#131C33;">
  Vous n'êtes pas connecté(e) — votre progression ne sera pas sauvegardée.
  <a href="#" onclick="showInlineLogin(); return false;" style="color:#00308F;font-weight:700;text-decoration:underline;">Se connecter</a>
  <div id="inlineLoginForm" style="display:none;max-width:340px;margin:12px auto 0;text-align:left;">
    <input type="email" id="inlineEmail" placeholder="Email" style="width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #EAF0FB;margin-bottom:8px;font-family:'Inter',sans-serif;">
    <input type="password" id="inlinePassword" placeholder="Mot de passe" style="width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #EAF0FB;margin-bottom:8px;font-family:'Inter',sans-serif;">
    <button onclick="submitInlineLogin()" style="width:100%;background:#F9921C;color:#001F5C;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;">Se connecter</button>
    <div id="inlineLoginError" style="color:#A32D2D;font-size:0.78rem;margin-top:6px;"></div>
  </div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-panel" id="mainPanel"></main>
</div>

<script>
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

{
  title:"Comprendre le métabolisme et l'insulinorésistance",
  sub:"Les fondations",
  content:[
    "Le métabolisme désigne l'ensemble des réactions chimiques qui transforment ce que vous mangez en énergie utilisable par vos cellules. Au centre de ce processus se trouve l'insuline, une hormone produite par le pancréas dont le rôle est de faire entrer le glucose (sucre) du sang vers les cellules, pour qu'il y soit utilisé ou stocké.",

function allDone(){ return progress.every(function(p){ return p.done; }); }

function updateHeaderProgress(){
  var doneCount = progress.filter(function(p){ return p.done; }).length;
  document.getElementById('progressLabel').textContent = doneCount + ' / ' + MODULES.length + ' modules';
  document.getElementById('headBarFill').style.width = (doneCount/MODULES.length*100) + '%';
}

function goTo(i){
  currentIndex = i;
  renderSidebar();
  renderModule(i);
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderModule(i){
  var m = MODULES[i];
  var wrap = document.getElementById('mainPanel');
  var html = '';
  html += '<span class="lesson-tag">Module '+(i+1)+' / '+MODULES.length+'</span>';
  html += '<h2>'+m.title+'</h2>';
  html += '<div class="video-box"><div class="illo">'+ILLUSTRATIONS[i]+'</div><div class="note">Illustration de la leçon — la vidéo filmée sera intégrée ici. Le contenu écrit ci-dessous est le vrai contenu du cours.</div></div>';
  html += '<div class="lesson-text">' + m.content.map(function(p){ return '<p>'+p+'</p>'; }).join('') + '</div>';
  if(m.takeaways.length){
    html += '<div class="takeaways"><h4>Points clés à retenir</h4><ul>' + m.takeaways.map(function(t){ return '<li>'+t+'</li>'; }).join('') + '</ul></div>';
  }
  if(i===0){

    + '<div id="quizResult"></div></div>';

function renderQuiz(i){
  var m = MODULES[i];
  var qHtml = '';
  m.quiz.forEach(function(q, qi){
    qHtml += '<div class="q-block" data-qi="'+qi+'"><div class="q-text">'+(qi+1)+'. '+q.q+'</div>';
    q.options.forEach(function(opt, oi){
      qHtml += '<label class="q-opt" data-oi="'+oi+'"><input type="radio" name="q'+qi+'" value="'+oi+'"> '+opt+'</label>';
    });
    qHtml += '</div>';
  });
  document.getElementById('quizQuestions').innerHTML = qHtml;
}

function submitQuiz(i){
  var m = MODULES[i];
  var correctCount = 0;
  var allAnswered = true;
  m.quiz.forEach(function(q, qi){
    var selected = document.querySelector('input[name="q'+qi+'"]:checked');
    var block = document.querySelector('.q-block[data-qi="'+qi+'"]');
    if(!selected){ allAnswered = false; return; }
    var chosen = parseInt(selected.value, 10);
    if(chosen === q.correct) correctCount++;
    block.querySelectorAll('.q-opt').forEach(function(optEl){
      var oi = parseInt(optEl.getAttribute('data-oi'), 10);
      if(oi === q.correct) optEl.classList.add('correct');
      else if(oi === chosen) optEl.classList.add('wrong');
    });
  });
  if(!allAnswered){
    document.getElementById('quizResult').innerHTML = '<div class="quiz-result fail">Merci de répondre à toutes les questions avant de valider.</div>';
    return;
  }
  var pct = Math.round((correctCount / m.quiz.length) * 100);
  var pass = pct >= 70;
  progress[i] = { done: pass, score: pct };
  var resultHtml = pass
    ? '<div class="quiz-result pass">✓ '+pct+'% de bonnes réponses — module validé !</div>'

    resultHtml += '<button class="btn-secondary" style="margin-top:10px;" onclick="goTo('+(i+1)+')">Module suivant →</button>';

    resultHtml += '<button class="btn-primary" style="margin-top:10px;" onclick="goToCert()">Voir mon certificat 🎓</button>';

  document.getElementById('quizSubmit').disabled = pass;
  renderSidebar();
  updateHeaderProgress();
  if(pass) saveProgressToServer();
}

function renderCertQR(certId, name, dateStr){
  try{
    var verifyUrl = location.origin + location.pathname.replace(/cours\.html.*$/,'') + 'verify.html'
      + '?id=' + encodeURIComponent(certId)
      + '&nom=' + encodeURIComponent(name)
      + '&date=' + encodeURIComponent(dateStr);
    var qr = qrcode(0, 'M');
    qr.addData(verifyUrl);
    qr.make();
    document.getElementById('certQR').innerHTML = qr.createSvgTag(3, 4);
  }catch(e){ /* si la génération échoue, le certificat reste valable sans QR */ }
}
function updateCertPreview(){
  var el = document.getElementById('certName');
  if(el) el.textContent = learnerName || 'Votre nom';
}

// ---------- SAUVEGARDE / CHARGEMENT DE LA PROGRESSION (serveur Railway + Supabase) ----------
function currentProgressPercent(){
  var doneCount = progress.filter(function(p){ return p.done; }).length;
  return Math.round((doneCount / MODULES.length) * 100);
}
async function saveProgressToServer(){
  if(!authToken) return; // mode invité (arrivé sans compte connecté) : rien à sauvegarder côté serveur
  try{
    await fetch(API_BASE + '/api/me/progress', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({
        courseSlug: courseSlug,
        progress: currentProgressPercent(),
        certificateIssued: allDone()
      })
    });
  }catch(e){ /* pas grave si ça échoue une fois — on retente à la prochaine action */ }
}

async function loadProgressAndStart(){
  if(!authToken){
    // Pas de compte connecté transmis : afficher le bandeau pour se connecter, démarrer en mode invité.
    document.getElementById('loginBanner').style.display = 'block';
    renderSidebar(); renderModule(0); updateHeaderProgress();
    return;
  }
  try{
    var res = await fetch(API_BASE + '/api/me', { headers: { 'Authorization': 'Bearer ' + authToken } });
    if(!res.ok) throw new Error('unauthorized');
    var data = await res.json();
    if(data.user && data.user.name) learnerName = data.user.name;
    document.getElementById('headAccount').textContent = 'Bonjour, ' + (data.user.name || '').split(' ')[0];
    saveTokenToCourseUrl();
    var backLink = document.querySelector('.back-link');
    if(backLink) backLink.href = 'index.html?token=' + encodeURIComponent(authToken);
    var enrollment = (data.courses || []).find(function(c){ return c.slug === courseSlug; });

    if(enrollment){
      var doneCount = Math.round((enrollment.progress / 100) * MODULES.length);
      for(var i=0; i<doneCount && i<MODULES.length; i++){ progress[i] = { done:true, score:100 }; }
      if(enrollment.certificate_issued || doneCount >= MODULES.length){
        renderSidebar(); updateHeaderProgress(); goToCert();
        return;
      }
    }
    renderSidebar();
    renderModule(Math.min(doneCount || 0, MODULES.length - 1));
    updateHeaderProgress();
  }catch(e){
    // Le token n'est plus valide ou le serveur est injoignable : bandeau de connexion + démarrage invité.
    authToken = null;
    document.getElementById('loginBanner').style.display = 'block';
    renderSidebar(); renderModule(0); updateHeaderProgress();
  }
}

async function downloadEbookFromCourse(){
  if(!authToken){
    alert("Connectez-vous pour télécharger l'ebook.");
    showInlineLogin();
    return;
  }
  try{
    var res = await fetch(API_BASE + '/api/download/ebook', { headers: { 'Authorization': 'Bearer ' + authToken } });
    if(!res.ok) throw new Error('accès refusé');
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'afroketo-7-jours-recettes.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert("Téléchargement impossible pour le moment.");
  }
}

function saveTokenToCourseUrl(){
  if(!authToken) return;
  var url = new URL(window.location.href);
  url.searchParams.set('token', authToken);
  url.searchParams.set('slug', courseSlug);
  window.history.replaceState(null, '', url.toString());
}

function showInlineLogin(){
  document.getElementById('inlineLoginForm').style.display = 'block';
}
async function submitInlineLogin(){
  var email = document.getElementById('inlineEmail').value.trim();
  var pass = document.getElementById('inlinePassword').value.trim();
  var errEl = document.getElementById('inlineLoginError');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Entrez votre email et mot de passe.'; return; }
  try{
    var res = await fetch(API_BASE + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pass })
    });
    var data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Connexion impossible.');
    authToken = data.token;
    document.getElementById('loginBanner').style.display = 'none';
    await loadProgressAndStart();
  }catch(e){
    errEl.textContent = e.message || 'Connexion impossible.';
  }
}

loadProgressAndStart();
</script>
