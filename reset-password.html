<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — Gevlon</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#F6F8FC;color:#131C33;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:18px;padding:44px 34px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,31,92,0.12);}
  h1{font-family:'Fraunces',serif;font-size:1.25rem;color:#001F5C;margin-bottom:8px;text-align:center;}
  p{font-size:0.88rem;color:#54617A;margin-bottom:20px;line-height:1.5;text-align:center;}
  label{font-size:0.78rem;font-weight:700;color:#54617A;display:block;margin-bottom:6px;}
  input{width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid #EAF0FB;font-family:'Inter',sans-serif;font-size:0.92rem;margin-bottom:16px;box-sizing:border-box;}
  .btn{width:100%;background:#F9921C;color:#001F5C;padding:13px;border-radius:999px;font-weight:700;border:none;font-size:0.92rem;cursor:pointer;}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{font-size:0.85rem;text-align:center;margin-top:14px;}
  .msg.ok{color:#1a7a3d;}
  .msg.fail{color:#A32D2D;}
  .center-link{display:block;text-align:center;margin-top:16px;font-size:0.85rem;color:#00308F;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
  <div class="card" id="card"></div>

  <script>
    var API_BASE = 'https://gevlon-backend-production.up.railway.app';
    var token = new URLSearchParams(location.search).get('token');
    var card = document.getElementById('card');

    function renderRequestForm(){
      card.innerHTML =
        '<h1>Mot de passe oublié ?</h1>' +
        '<p>Entrez votre email, on vous envoie un lien pour en choisir un nouveau.</p>' +
        '<label>Email</label>' +
        '<input type="email" id="emailInput" placeholder="vous@email.com">' +
        '<button class="btn" id="submitBtn" onclick="submitRequest()">Envoyer le lien</button>' +
        '<div class="msg" id="msg"></div>' +
        '<a class="center-link" href="index.html">← Retour au site</a>';
    }

    async function submitRequest(){
      var email = document.getElementById('emailInput').value.trim();
      var msg = document.getElementById('msg');
      var btn = document.getElementById('submitBtn');
      if(!email){ msg.className='msg fail'; msg.textContent='Entrez votre email.'; return; }
      btn.disabled = true; btn.textContent = 'Un instant…';
      try{
        var res = await fetch(API_BASE + '/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        var data = await res.json();
        msg.className = 'msg ok';
        msg.textContent = data.message || 'Si un compte existe avec cet email, un lien a été envoyé.';
      }catch(e){
        msg.className = 'msg fail';
        msg.textContent = "Une erreur est survenue, réessayez.";
      }finally{
        btn.disabled = false; btn.textContent = 'Envoyer le lien';
      }
    }

    function renderResetForm(){
      card.innerHTML =
        '<h1>Choisir un nouveau mot de passe</h1>' +
        '<p>Entrez votre nouveau mot de passe (6 caractères minimum).</p>' +
        '<label>Nouveau mot de passe</label>' +
        '<input type="password" id="passInput" placeholder="••••••••">' +
        '<button class="btn" id="submitBtn" onclick="submitReset()">Changer mon mot de passe</button>' +
        '<div class="msg" id="msg"></div>';
    }

    async function submitReset(){
      var pass = document.getElementById('passInput').value.trim();
      var msg = document.getElementById('msg');
      var btn = document.getElementById('submitBtn');
      if(!pass || pass.length < 6){ msg.className='msg fail'; msg.textContent='6 caractères minimum.'; return; }
      btn.disabled = true; btn.textContent = 'Un instant…';
      try{
        var res = await fetch(API_BASE + '/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: pass })
        });
        var data = await res.json();
        if(!res.ok) throw new Error(data.error || 'Lien invalide.');
        card.innerHTML = '<h1>C\'est fait !</h1><p>Votre mot de passe a été changé. Vous pouvez maintenant vous connecter.</p><a class="btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box;" href="index.html">Retour au site</a>';
      }catch(e){
        msg.className = 'msg fail';
        msg.textContent = e.message || 'Une erreur est survenue.';
        btn.disabled = false; btn.textContent = 'Changer mon mot de passe';
      }
    }

    if(token){ renderResetForm(); } else { renderRequestForm(); }
  </script>
</body>
</html>
